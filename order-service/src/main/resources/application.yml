# =====================================================================
# order-service  -  pedidos de Pedidos360
# Todo valor sensible o dependiente del entorno se lee de variables de entorno (ver ../.env.example).
# =====================================================================
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service

  # ---- Base de datos propia del servicio (RDS MySQL: un schema por microservicio) ----
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  # ---- Cognito: valida el JWT (issuer, firma, vigencia) ----
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ULZawCXgF}

  # ---- RabbitMQ: docker-compose (clúster de 2 nodos) o Amazon MQ for RabbitMQ ----
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    connection-timeout: 3000ms
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

  # ---- AWS (SNS / SQS / S3). Credenciales: cadena por defecto (LabInstanceProfile en EC2, perfil local, etc.) ----
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        listener:
          max-concurrent-messages: 10
          max-messages-per-poll: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

# =====================================================================
# Configuracion propia de Pedidos360
# =====================================================================
pedidos360:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # catalog-service (REST sincrono con reenvio del JWT)
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

  # Poner PEDIDOS360_MESSAGING_ENABLED=false para correr la API sin colas (p. ej. en Lambda)
  messaging:
    enabled: ${PEDIDOS360_MESSAGING_ENABLED:true}
    consumers-enabled: ${PEDIDOS360_CONSUMERS_ENABLED:true}

  # SNS + SQS + S3. AWS_ENABLED=true una vez creados los recursos (infra/aws/01-create-sns-sqs.sh)
  aws:
    enabled: ${AWS_ENABLED:false}
    sns:
      topic-arn: ${SNS_TOPIC_ARN:}
    sqs:
      auditoria-queue: ${SQS_AUDITORIA_QUEUE:pedidos360-auditoria}
    s3:
      tickets-bucket: ${TICKETS_BUCKET:}

  # Prueba de DLQ: pedidos de usuarios con este dominio de correo fallan en el consumidor de notificaciones
  demo:
    failure-email-domain: ${DEMO_FAILURE_EMAIL_DOMAIN:fail.pedidos360.test}

  # ---- Nombres de exchanges / colas / routing keys (UNICO lugar donde se definen) ----
  rabbit:
    exchanges:
      direct: pedidos360.direct
      topic: pedidos360.topic
      dlx: pedidos360.dlx
    queues:
      notificaciones: pedidos360.notificaciones.q
      tickets: pedidos360.tickets.q
      inventario: pedidos360.inventario.q
    dlq-suffix: .dlq
    routing-keys:
      ticket: ticket.generar
      notificaciones-binding: "pedido.#"
      pedido-creado: pedido.creado
      pedido-estado-prefix: "pedido.estado."
      inventario-binding: "inventario.#"
      stock-bajo: inventario.stock.bajo
    consumer:
      max-attempts: 3
      backoff-ms: 500
